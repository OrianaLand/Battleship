<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <title>Battleship</title>
  </head>
  <body>
    <main>
      <div id="app">
        <div id="wrapper">
          <header>
            <h1 id="title">BATTLESHIP</h1>
          </header>
          <section id="status">
            <div id="message"></div>
            <div id="current-turn"></div>
          </section>
          <section class="setup-container">
            <div id="difficulty">
              <p id="difficulty-label">Choose difficulty</p>
              <div id="difficulty-buttons">
                <button data-difficulty="sailor">Sailor</button>
                <button data-difficulty="captain">Captain</button>
                <button data-difficulty="admiral">Admiral</button>
              </div>
            </div>
            <div id="play-area">
              <div class="board">
                <div id="human-board"></div>
                <div id="cpu-board"></div>
              </div>
              <div id="placement-panel"> 
                <div id="ship-list-box"></div>
                <div id="controls">
                  <div id="tools-box"></div>
                <button id="random-btn" title="Place randomly">
                  <i class="fa-solid fa-dice" aria-hidden="true"></i>
                  <span>Deploy</span>
                </button>
              </div>
            </div>
            </div>
          </section>
          <section id="game-actions">
            <button id="reset-btn"></button>
            <div id="confirm-wrapper">
              <div id="difficulty-bubble">You must choose a difficulty</div>
              <button id="confirm-btn">Confirm</button>
            </div>
          </section>
        </div>
      </div>
    </main>
    <small id="credit">© 2026 Developed by <a href="https://github.com/OrianaLand" target="_blank" rel="noopener noreferrer">Oriana</a>
    </small>
  </body>
</html>
